        <!DOCTYPE html>
        <html lang="pt-br">

        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Two-music</title>
            <link rel="stylesheet" href="style.css">
            <link rel="shortcut icon" href="photos/ChatGPT Image 15 de abr. de 2026, 20_35_28.png" type="image/.png">
        </head>

        <body>
            <header>
                <section class="navbar flex flex-between align-items-center fixed fixed-top flex-column">
                    <div class="navbar-title flex gap flex-center">
                        <img src="photos/ChatGPT Image 22 de abr. de 2026, 19_03_33.png" alt="Photo logo" class="logo">


            
                    </div>
                    <div class="navbar-content flex flex-column">
                        <ul class="ul-navbar flex flex-column cursor">
                            <div class="item-ul flex align-items-center">
                                <img src="https://img.icons8.com/?size=100&id=i6fZC6wuprSu&format=png&color=ffffff"
                                    alt="icon photo home" class="icon-home icon-ul">
                                <li class="li-navbar-text li-menu-text home">Inicio</li>
                            </div>
                            <div class="item-ul flex align-items-center">
                                <img src="https://img.icons8.com/?size=100&id=59878&format=png&color=ffffff"
                                    alt="photo icon search" class="icon-search icon-ul">
                                <li class="li-navbar-text li-menu-text search-text">Pesquisar</li>
                            </div>
                            <div class="item-ul flex align-items-center">
                                <img src="https://img.icons8.com/?size=100&id=42763&format=png&color=ffffff" alt="icon-library"
                                    class="icon-library icon-ul">
                                <li class="li-navbar-text li-menu-text">Biblioteca</li>
                            </div>
                            <div class="item-ul flex align-items-center">
                                <img src="https://img.icons8.com/?size=100&id=11153&format=png&color=ffffff" alt="icon-plus"
                                    class="icon-plus icon-ul">
                                <li class="li-navbar-text li-menu-text">Criar playlist</li>
                            </div>
                            <div class="item-ul flex align-items-center">
                                <img src="https://img.icons8.com/?size=100&id=23822&format=png&color=ffffff" alt="icon hearth photo" class="icon-hearth icon-ul">
                                <li class="li-navbar-text li-menu-text">Musicas curtidas</li>
                            </div>
                        </ul>
                        <div class="icons-navbar icons-menu flex gap align-items-center absolute">
                            <img src="https://img.icons8.com/?size=100&id=32309&format=png&color=ffffff"
                                alt="Icon Instagram photo" class="icon-instagram cursor icon-navbar">
                            <img src="https://img.icons8.com/?size=100&id=118467&format=png&color=ffffff"
                                alt="Icon Facebook photo" class="icon-facebook cursor icon-navbar">
                            <img src="https://img.icons8.com/?size=100&id=12599&format=png&color=ffffff" alt="Icon github photo"
                                class="icon-github cursor icon-navbar">
                            <img src="https://img.icons8.com/?size=100&id=98960&format=png&color=ffffff"
                                alt="Icon Linkedin photo" class="icon-linkedin cursor icon-navbar">
                        </div>
                    </div>
                </section>
             
            </header>
            <main>
                <section class="search-section flex flex-column fixed fixed-top ">
                    <h2>Pesquisar músicas</h2>
                    <form action="#" method="get" class="flex flex-column gap">
                        <label for="search" class="absolute text-grey flex gap">
                            <img src="https://img.icons8.com/?size=100&id=132&format=png&color=ffffff" alt="Icon search photo"
                                class="icon-search-label">

                            <p>Digite a musica que você deseja</p>
                        </label>
                        <input type="search" name="q" id="search">
                    </form>
                    <section class="results-search flex gap flex-column">
                        <div class="albums-search-div flex flex-column gap">
                            <h1>Albums</h1>
                            <div class="albums-search flex gap"></div>
                        </div>
                        <div class="artistis-search-div flex flex-column gap">
                            <h1>Artistas</h1>
                            <div class="artistis-search flex gap"></div>
                        </div>
                    </section>
                </section>
                <section class="primary-section flex gap">
                
                    <section class="content-section flex flex-column gap">
                        <section class="musics-section cursor flex">
                            <h1 class="absolute">Artistas famosos</h1>
                            <div class="artistis-grid cursor flex"></div>

                        </section>
                        <section class="musics-section cursor flex">
                            <h1 class="absolute">Albuns famosos</h1>
                            <div class="albums-grid cursor flex ">
                            </div>
                        </section>
                    </section>

                </section>

            </main>
            <script src="scripts/script.js"></script>

        </body>

        </html>
